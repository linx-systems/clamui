name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected commit SHA (optional)
        type: string


permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on master,
# manual runs and schedules are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The frontend type-check ("bun run check") runs in the Test workflow
# (Tauri desktop build), so it is not repeated here.
jobs:
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build frontend assets for Tauri
        working-directory: desktop
        run: bun run build

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
