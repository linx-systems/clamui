name: Build Flatpak

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

jobs:
  build-flatpak:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Flatpak SDK extensions
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-info --user flathub org.freedesktop.Sdk.Extension.node24//26.08 >/dev/null
          flatpak remote-info --user flathub org.freedesktop.Sdk.Extension.rust-stable//26.08 >/dev/null
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Sdk.Extension.node24//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08


      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flathub/io.github.linx_systems.ClamUI.local.yml
          bundle: clamui-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.runner }}-${{ matrix.arch }}

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: clamui-${{ matrix.arch }}.flatpak
          retention-days: 7
