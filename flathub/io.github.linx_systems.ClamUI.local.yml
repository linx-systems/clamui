app-id: io.github.linx_systems.ClamUI
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: clamui

finish-args:
  # Display - use fallback-x11 for X11/Wayland compatibility
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri

  # Network for virus database updates
  - --share=network

  # D-Bus permissions for notifications
  - --talk-name=org.freedesktop.Notifications

  # Flatpak exposes the AT-SPI accessibility bus through its own proxy
  # so no explicit org.a11y.Bus talk permission is required here.

  # Secret Service for secure API key storage (GNOME Keyring, KWallet)
  - --talk-name=org.freedesktop.secrets

  # StatusNotifierItem (SNI) system tray protocol
  # Allows the tray service to register on D-Bus and communicate with
  # desktop environment tray watchers (KDE, Cinnamon, MATE, XFCE, Budgie)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.x.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher

  # GVFS for file browser integration
  - --filesystem=xdg-run/gvfsd

  # Full filesystem access for antivirus scanning
  # Required for file manager integration to scan arbitrary user files
  # Also covers ~/.config/systemd/user and ~/.local/share for file manager integrations
  - --filesystem=host

  # Allow flatpak-spawn --host for host ClamAV tools, systemctl, and config helpers
  - --talk-name=org.freedesktop.Flatpak

modules:
  # System tray uses StatusNotifierItem D-Bus protocol

  # intltool required for building libdbusmenu (even with --disable-nls)
  - name: intltool
    cleanup:
      - "*"
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        mirror-urls:
          - https://deb.debian.org/debian/pool/main/i/intltool/intltool_0.51.0.orig.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
        x-checker-data:
          type: anitya
          project-id: 1385
          url-template: https://launchpad.net/intltool/trunk/$version/+download/intltool-$version.tar.gz

  # libdbusmenu for system tray context menu export via com.canonical.dbusmenu protocol
  # NOTE: tray_service.py uses Dbusmenu-0.4 (GLib API), NOT DbusmenuGtk3-0.4
  # The --with-gtk=3 is required for the build system, but only the GLib portion is used at runtime
  - name: libdbusmenu
    buildsystem: autotools
    build-options:
      cflags: -Wno-error
      env:
        HAVE_VALGRIND_FALSE: "#"
        HAVE_VALGRIND_TRUE: ""
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-nls
      - --enable-introspection=yes
    sources:
      - type: archive
        url: https://launchpadlibrarian.net/243440794/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
    cleanup:
      - /include
      - /libexec
      - /share/gtk-doc
      - /share/libdbusmenu
      - /lib/girepository-1.0/DbusmenuGtk3-0.4.typelib
      - /lib/libdbusmenu-gtk3.*
      - "*.la"

  # Python build dependencies (hatchling for pyproject.toml builds)
  # Generated by: flatpak_pip_generator --runtime='org.gnome.Sdk//51' -r requirements-build.txt -o python3-build-deps --checker-data
  - python3-build-deps.json

  # Python runtime dependencies and their pinned transitive dependencies.
  # Generated by: req2flatpak -r requirements-runtime-pinned.txt -t 314-x86_64 314-aarch64 -o python3-runtime-deps.json
  # Supports both x86_64 and aarch64 architectures
  - python3-runtime-deps.json

  - name: clamui
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 data/io.github.linx_systems.ClamUI.desktop /app/share/applications/io.github.linx_systems.ClamUI.desktop
      - install -Dm644 data/io.github.linx_systems.ClamUI.metainfo.xml /app/share/metainfo/io.github.linx_systems.ClamUI.metainfo.xml
      - install -Dm644 icons/io.github.linx_systems.ClamUI.svg /app/share/icons/hicolor/scalable/apps/io.github.linx_systems.ClamUI.svg
      - install -Dm644 icons/io.github.linx_systems.ClamUI.png /app/share/icons/hicolor/128x128/apps/io.github.linx_systems.ClamUI.png
      - install -Dm644 signing-key.asc /app/share/clamui/signing-key.asc
      # File manager integration files (bundled for first-run installation)
      - install -Dm644 flathub/integrations/io.github.linx_systems.ClamUI.nemo_action /app/share/clamui/integrations/io.github.linx_systems.ClamUI.nemo_action
      - install -Dm644 flathub/integrations/io.github.linx_systems.ClamUI-virustotal.nemo_action /app/share/clamui/integrations/io.github.linx_systems.ClamUI-virustotal.nemo_action
      - install -Dm644 flathub/integrations/io.github.linx_systems.ClamUI.service.desktop /app/share/clamui/integrations/io.github.linx_systems.ClamUI.service.desktop
      - install -Dm644 flathub/integrations/io.github.linx_systems.ClamUI-virustotal.desktop /app/share/clamui/integrations/io.github.linx_systems.ClamUI-virustotal.desktop
      - install -Dm755 flathub/integrations/clamui-scan-nautilus.sh /app/share/clamui/integrations/clamui-scan-nautilus.sh
      - install -Dm755 flathub/integrations/clamui-virustotal-nautilus.sh /app/share/clamui/integrations/clamui-virustotal-nautilus.sh
    sources:
      - type: dir
        path: ..
