app-id: io.github.linx_systems.ClamUI
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
add-build-extensions:
  org.freedesktop.Sdk.Extension.node24:
    version: "26.08"
    directory: lib/sdk/node24
  org.freedesktop.Sdk.Extension.rust-stable:
    version: "26.08"
    directory: lib/sdk/rust-stable
command: clamui
# This checkout recipe is intentionally the source of truth while the Rust/Tauri
# migration has no release tag. Generate a release manifest with
# scripts/generate-flatpak-sources.sh --release-url URL --release-commit SHA
# only after a published source commit and its generated locked sources exist.
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --share=network


  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets

  # In Flatpak ksni registers its session-unique D-Bus name with the
  # watcher; owning the StatusNotifierItem PID name is not permitted.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.x.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher

  # Host ClamAV, systemd user scheduling, and file-manager integrations remain
  # host integrations. ClamUI does not ship a scanner engine or virus database.
  - --filesystem=xdg-run/gvfsd
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: clamui
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_NET_OFFLINE: "true"
        YARN_ENABLE_NETWORK: "0"
    build-commands:
      # Generated Cargo config and source records make all Cargo resolution
      # locked and offline for this exact Cargo.lock.
      - install -Dm644 cargo/config .cargo/config.toml
      # Yarn 1 only consults this file for its tarball mirror. `yarn config
      # set` can write outside the module source tree, leaving --offline to
      # query the registry despite flatpak-node-generator's fetched archives.
      - |
        cat > desktop/.yarnrc <<'EOF'
        yarn-offline-mirror "/run/build/clamui/flatpak-node/yarn-mirror"
        yarn-offline-mirror-pruning false
        EOF
      - cd desktop && yarn install --offline --frozen-lockfile --ignore-scripts
      - cd desktop && yarn run check && ./node_modules/.bin/vite build
      - cargo build --offline --locked --release -p clamui --bin clamui
      - cargo build --offline --locked --release -p clamui-core --bin clamui-scheduled-scan
      - install -Dm755 target/release/clamui /app/bin/clamui
      - install -Dm755 target/release/clamui-scheduled-scan /app/bin/clamui-scheduled-scan
      - install -Dm644 data/io.github.linx_systems.ClamUI.desktop /app/share/applications/io.github.linx_systems.ClamUI.desktop
      - install -Dm644 data/io.github.linx_systems.ClamUI.metainfo.xml /app/share/metainfo/io.github.linx_systems.ClamUI.metainfo.xml
      - install -Dm644 icons/io.github.linx_systems.ClamUI.svg /app/share/icons/hicolor/scalable/apps/io.github.linx_systems.ClamUI.svg
      - install -Dm644 icons/io.github.linx_systems.ClamUI.png /app/share/icons/hicolor/128x128/apps/io.github.linx_systems.ClamUI.png
      - install -d /app/share/clamui
      - cp -a crates/clamui-core/assets/integrations /app/share/clamui/integrations
      - find /app/share/clamui/integrations -type f -name '*.sh' -exec chmod 0755 '{}' +
    sources:
      - type: dir
        skip:
          - .git
          - .venv
          - target
          - desktop/node_modules
          - desktop/dist
          - website
          - build-appimage-temp
          - build-appimage-tools
          - dist
        path: ..
      # Generated only from an actual Cargo.lock; never hand-edit checksums.
      - cargo-sources.json
      # Generated only from Bun's exported desktop/yarn.lock. It includes the
      # x86_64 and aarch64 optional esbuild/Rollup packages used by Vite.
      - bun-sources.json
