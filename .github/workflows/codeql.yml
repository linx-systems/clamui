name: CodeQL

on:
  # Pull requests and pushes are only analysed when code CodeQL scans changed.
  # The weekly schedule below covers everything else.
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "desktop/**"
      - "website/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [master]
    paths:
      - "crates/**"
      - "desktop/**"
      - "website/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected commit SHA (optional)
        type: string


permissions:
  security-events: write
  contents: read
  actions: read

# A newer push to the same pull request cancels the older run. Runs on master,
# manual runs and schedules are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Rust and TypeScript
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust,javascript-typescript
          build-mode: none

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build TypeScript frontend
        working-directory: desktop
        run: bun run build

      - name: Build Rust workspace
        run: cargo build --workspace --locked

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
