name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Build the Debian artifacts (full clamui + matching privileged-helper) on
  # tag pushes.  Secrets are inherited so the reusable build workflow can sign
  # the packages with GPG.
  build-deb:
    uses: ./.github/workflows/build-deb.yml
    secrets: inherit

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Debian package artifacts
        uses: actions/download-artifact@v7
        with:
          name: debian-packages
          path: debs

      - name: Read release notes
        id: notes
        run: |
          NOTES=$(sed '/^$/d' RELEASE_NOTES.md | tail -n +2)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body: ${{ steps.notes.outputs.notes }}
          # Attach both .deb artifacts; the privileged-helper package is the
          # stable host artifact Flatpak users install once.
          files: |
            debs/clamui_*_all.deb
            debs/clamui-privileged-helper_*_all.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}