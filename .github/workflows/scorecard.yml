name: OpenSSF Scorecard

# Supply-chain security analysis: https://scorecard.dev
# Results are published to the Scorecard API (README badge) and uploaded to the
# repository's code scanning alerts.

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Weekly run so the badge and the code scanning results stay current.
  schedule:
    - cron: "30 6 * * 1"
  push:
    branches: [master]
  workflow_dispatch:

# Everything is read-only at the top level; the job below adds only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Scorecard API only accepts published results from the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results and fetch the badge (OIDC token).
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
