name: Build AppImage

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the AppImage with GPG"
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        description: "Sign the AppImage with GPG"
        type: boolean
        default: false
    secrets:
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable


      - name: Install pinned AppImage tool
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" \
            --output appimagetool-x86_64.AppImage
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum --check
          chmod +x appimagetool-x86_64.AppImage
          echo "APPIMAGETOOL=$GITHUB_WORKSPACE/appimagetool-x86_64.AppImage" >> "$GITHUB_ENV"


      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build AppImage
        env:
          UPDATE_INFORMATION: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign == true) && 'gh-releases-zsync|linx-systems|clamui|latest|ClamUI-*-x86_64.AppImage.zsync' || '' }}
        run: ./appimage/build-appimage.sh

      - name: Smoke-test native AppImage
        run: |
          set -euo pipefail
          appimage=(ClamUI-*-x86_64.AppImage)
          test "${#appimage[@]}" -eq 1
          chmod +x "${appimage[0]}"
          "./${appimage[0]}" --appimage-extract
          test -x squashfs-root/usr/bin/clamui
          test -x squashfs-root/usr/bin/clamui-scheduled-scan
          test -x squashfs-root/usr/bin/clamui-apply-preferences
          squashfs-root/usr/bin/clamui --help
          squashfs-root/usr/bin/clamui-scheduled-scan --help
          rm -rf squashfs-root

      - name: Import GPG key
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign == true
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
        id: gpg

      - name: Sign AppImage
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign == true
        env:
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          appimage=(ClamUI-*-x86_64.AppImage)
          test "${#appimage[@]}" -eq 1
          "./${appimage[0]}" --appimage-extract
          sign_args=(--sign --sign-key "${{ steps.gpg.outputs.fingerprint }}")
          if [[ "${{ startsWith(github.ref, 'refs/tags/') || inputs.sign == true }}" == "true" ]]; then
            sign_args+=(-u "gh-releases-zsync|linx-systems|clamui|latest|ClamUI-*-x86_64.AppImage.zsync")
          fi
          "${APPIMAGETOOL}" "${sign_args[@]}" squashfs-root/ "${appimage[0]}"
          rm -rf squashfs-root

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage-package
          path: |
            ClamUI-*-x86_64.AppImage
            ClamUI-*-x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 7
