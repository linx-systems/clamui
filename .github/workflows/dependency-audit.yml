name: Dependency Audit

on:
  # Pull requests and pushes only run when dependency manifests or lockfiles
  # change. The weekly schedule catches newly published advisories.
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "desktop/src-tauri/Cargo.toml"
      - "desktop/package.json"
      - "desktop/bun.lock"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "desktop/src-tauri/Cargo.toml"
      - "desktop/package.json"
      - "desktop/bun.lock"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected commit SHA (optional)
        type: string


permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on master,
# manual runs and schedules are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit locked Rust dependencies
        run: cargo audit

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Verify locked frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Audit frontend dependencies
        working-directory: desktop
        # GHSA-fc5q-39xc-vjpf affects picomatch used only by the Vite build
        # tooling, not the shipped frontend. No patched release exists for the
        # affected versions <=4.0.7. Remove this exception when picomatch or
        # Vite publishes a fix; keep all other advisories enforced.
        run: bun audit --ignore GHSA-fc5q-39xc-vjpf
