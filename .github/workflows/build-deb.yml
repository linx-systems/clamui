name: Build Debian Package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the Debian package(s) with GPG"
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        description: "Sign the Debian package(s) with GPG"
        type: boolean
        default: false
    secrets:
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify runner architecture
        run: test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            dpkg-sig \
            fakeroot \
            gettext \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build Debian packages
        run: ./debian/build-deb.sh dist

      - name: Import GPG key
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign == true
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
        id: gpg

      - name: Sign Debian packages
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign == true
        run: |
          set -euo pipefail
          shopt -s nullglob
          arch="${{ matrix.architecture }}"
          debs=()
          for package in clamui clamui-privileged-helper; do
            pattern="dist/${package}_*_${arch}.deb"
            matches=( $pattern )
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one match for $pattern, found ${#matches[@]}" >&2
              exit 1
            fi
            debs+=( "${matches[0]}" )
          done

          dpkg-sig --sign builder -k "${{ steps.gpg.outputs.fingerprint }}" "${debs[@]}"

          for deb in "${debs[@]}"; do
            verification="$(dpkg-sig --verify "$deb")" || {
              printf '%s\n' "$verification" >&2
              exit 1
            }
            printf '%s\n' "$verification"
            grep -q "^GOODSIG _gpgbuilder ${{ steps.gpg.outputs.fingerprint }} " <<< "$verification"
          done

      - name: Upload Debian package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages-${{ matrix.architecture }}
          path: |
            dist/clamui_*_${{ matrix.architecture }}.deb
            dist/clamui-privileged-helper_*_${{ matrix.architecture }}.deb
          if-no-files-found: error
          retention-days: 7
