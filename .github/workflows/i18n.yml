name: Translations

on:
  push:
    branches: [master]
    paths:
      - "po/**"
      - "crates/clamui-core/**"
      - "desktop/src/**"
      - "desktop/src-tauri/src/**"
      - "desktop/package.json"
      - "desktop/bun.lock"
      - "scripts/check-translations.sh"
      - "scripts/check-compiled-catalogs.ts"
      - "scripts/check-potfiles.sh"
      - "scripts/update-pot.sh"
      - "scripts/extract-typescript-gettext.ts"
      - ".github/workflows/i18n.yml"
  pull_request:
    branches: [master]
    paths:
      - "po/**"
      - "crates/clamui-core/**"
      - "desktop/src/**"
      - "desktop/src-tauri/src/**"
      - "desktop/package.json"
      - "desktop/bun.lock"
      - "scripts/check-translations.sh"
      - "scripts/check-compiled-catalogs.ts"
      - "scripts/check-potfiles.sh"
      - "scripts/update-pot.sh"
      - ".github/workflows/i18n.yml"
      - "scripts/extract-typescript-gettext.ts"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected commit SHA (optional)
        type: string


permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on master,
# manual runs and schedules are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-translations:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Verify locked frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Validate catalog files
        run: ./scripts/check-translations.sh

      - name: Validate Rust and TypeScript catalog coverage
        run: ./scripts/check-potfiles.sh

      - name: Verify generated catalog is current
        run: ./scripts/update-pot.sh --check
