[package]
name = "clamui"
version = "0.5.0"
edition = "2021"
description = "ClamUI desktop runtime"
license = "MIT"
default-run = "clamui"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "clamui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
clamui-core = { path = "../../crates/clamui-core" }
ksni = "0.3.6"
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
url = "2"
