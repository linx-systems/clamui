name: Dependency Review

on:
  # Only pull requests that touch dependency manifests, lockfiles or workflow
  # files (GitHub Actions versions) need a dependency review.
  pull_request:
    branches: [master]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/package.json"
      - "**/bun.lock"
      - "**/yarn.lock"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "**/requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base commit SHA for dependency comparison
        required: true
        type: string
      head_ref:
        description: Head commit SHA for dependency comparison
        required: true
        type: string


# A newer push to the same pull request cancels the older run. Runs on master,
# manual runs and schedules are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.head_ref }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          base-ref: ${{ inputs.base_ref }}
          head-ref: ${{ inputs.head_ref }}
