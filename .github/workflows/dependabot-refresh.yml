name: Refresh Dependabot sources

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - 'crates/**/Cargo.toml'
      - desktop/src-tauri/Cargo.toml
      - desktop/package.json
      - desktop/bun.lock
      - desktop/yarn.lock
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open Dependabot pull request number
        required: true
        type: string

permissions: {}

concurrency:
  group: dependabot-refresh-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      branch: ${{ steps.pr.outputs.branch }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      translations: ${{ steps.pr.outputs.translations }}
    steps:
      - name: Inspect and guard pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid pull request number' >&2; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch && "$EVENT_REF" != refs/heads/master ]]; then
            echo 'Run manual refresh from master, not the pull request branch.' >&2; exit 1
          fi
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          jq -e --arg repo "$REPO" '
            .state == "open" and .user.login == "dependabot[bot]" and
            .base.repo.full_name == $repo and .head.repo.full_name == $repo and
            .base.ref == "master" and (.head.ref | test("^dependabot/(cargo|bun|npm_and_yarn)/[A-Za-z0-9._/+~-]+$")) and
            (.head.sha | test("^[0-9a-f]{40}$")) and (.base.sha | test("^[0-9a-f]{40}$"))
          ' <<<"$pr" >/dev/null || { echo 'Pull request identity, repository, base, or branch is not eligible.' >&2; exit 1; }
          head="$(jq -r .head.sha <<<"$pr")"
          base="$(jq -r .base.sha <<<"$pr")"
          branch="$(jq -r .head.ref <<<"$pr")"
          if [[ "$EVENT_NAME" == pull_request_target && "$head" != "$EVENT_HEAD" ]]; then
            echo 'Stale pull request event; a newer head already exists.' >&2; exit 1
          fi
          files="$(gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100")"
          changed_count="$(jq -r .changed_files <<<"$pr")"
          [[ "$changed_count" =~ ^[1-9][0-9]*$ ]] && \
            jq -e --argjson count "$changed_count" '(add | length) == $count' <<<"$files" >/dev/null || \
            { echo 'Incomplete pull request file list; refusing refresh.' >&2; exit 1; }
          jq -e '
            (add) as $files | ($files | length > 0) and
            all($files[]; .status == "modified" and
              (.filename | test("^(Cargo\\.lock|Cargo\\.toml|crates/[^/]+/Cargo\\.toml|desktop/src-tauri/Cargo\\.toml|desktop/package\\.json|desktop/bun\\.lock|desktop/yarn\\.lock|flathub/cargo-sources\\.json|flathub/bun-sources\\.json)$"))) and
            any($files[]; .filename | test("^(Cargo\\.lock|Cargo\\.toml|crates/[^/]+/Cargo\\.toml|desktop/src-tauri/Cargo\\.toml|desktop/package\\.json|desktop/bun\\.lock|desktop/yarn\\.lock)$"))
          ' <<<"$files" >/dev/null || { echo 'Unexpected or ineligible changed paths; refusing refresh.' >&2; exit 1; }
          translations="$(jq -r 'add | any(.[]; .filename == "desktop/package.json" or .filename == "desktop/bun.lock")' <<<"$files")"
          printf 'number=%s\nbranch=%s\nhead=%s\nbase=%s\ntranslations=%s\n' "$PR_NUMBER" "$branch" "$head" "$base" "$translations" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
          path: repo

      - name: Snapshot only dependency data
        working-directory: repo
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
          SNAPSHOT: ${{ runner.temp }}/dependency-snapshot
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo 'PR branch must include current master; request @dependabot rebase before refreshing.' >&2; exit 1
          fi
          mkdir -p "$SNAPSHOT/desktop"
          for file in Cargo.lock desktop/package.json desktop/bun.lock desktop/yarn.lock flathub/cargo-sources.json flathub/bun-sources.json; do
            mode="$(git ls-tree "$HEAD_SHA" -- "$file" | cut -d ' ' -f 1)"
            [[ "$mode" == 100644 ]] || { echo "Unsafe or missing file at PR head: $file" >&2; exit 1; }
          done
          for file in Cargo.lock desktop/package.json desktop/bun.lock; do
            git show "$HEAD_SHA:$file" > "$SNAPSHOT/$file"
          done

      - name: Checkout pinned Flatpak generators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flatpak/flatpak-builder-tools
          ref: 9d86d336a39b9af38b86f114b6ce5820fe260f91
          persist-credentials: false
          path: generators

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install generator prerequisites
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/generator-venv"
          "$RUNNER_TEMP/generator-venv/bin/pip" install 'aiohttp==3.13.3' 'PyYAML==6.0.3' 'tomlkit==0.13.3' 'poetry-core==2.2.1'
          "$RUNNER_TEMP/generator-venv/bin/pip" install --no-build-isolation --no-deps "$GITHUB_WORKSPACE/generators/node"
          echo "$RUNNER_TEMP/generator-venv/bin" >> "$GITHUB_PATH"

      - name: Generate from trusted scripts and snapshot data
        working-directory: repo
        env:
          FLATPAK_CARGO_GENERATOR: ${{ github.workspace }}/generators/cargo/flatpak-cargo-generator.py
          SNAPSHOT: ${{ runner.temp }}/dependency-snapshot
        run: bash scripts/refresh-dependabot-sources.sh "$SNAPSHOT"

      - name: Save only generated files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-generated-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: |
            repo/desktop/bun.lock
            repo/desktop/yarn.lock
            repo/flathub/cargo-sources.json
            repo/flathub/bun-sources.json

  publish:
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.generate.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Retrieve generated files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependabot-generated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generated

      - name: Publish exact generated paths and dispatch verification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.generate.outputs.number }}
          BRANCH: ${{ needs.generate.outputs.branch }}
          HEAD_SHA: ${{ needs.generate.outputs.head }}
          BASE_SHA: ${{ needs.generate.outputs.base }}
          TRANSLATIONS: ${{ needs.generate.outputs.translations }}
          GENERATED: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          check_pr() {
            local expected="$1" pr
            pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
            jq -e --arg repo "$REPO" --arg branch "$BRANCH" --arg head "$expected" --arg base "$BASE_SHA" '
              .state == "open" and .user.login == "dependabot[bot]" and
              .head.repo.full_name == $repo and .base.repo.full_name == $repo and
              .base.ref == "master" and .base.sha == $base and
              .head.ref == $branch and .head.sha == $head
            ' <<<"$pr" >/dev/null || { echo 'PR identity, base, branch, or head changed; refusing to continue.' >&2; exit 1; }
          }
          wait_for_pr_head() {
            local old_head="$1" new_head="$2" pr observed branch_head attempt
            for attempt in {1..20}; do
              pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
              observed="$(jq -er --arg repo "$REPO" --arg branch "$BRANCH" --arg old "$old_head" --arg new "$new_head" --arg base "$BASE_SHA" '
                select(.state == "open" and .user.login == "dependabot[bot]" and
                  .head.repo.full_name == $repo and .base.repo.full_name == $repo and
                  .base.ref == "master" and .base.sha == $base and .head.ref == $branch and
                  (.head.sha == $old or .head.sha == $new)) | .head.sha
              ' <<<"$pr")" || { echo 'PR identity, base, branch, or head changed while awaiting synchronization.' >&2; exit 1; }
              branch_head="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
              [[ "$branch_head" == "$new_head" ]] || { echo 'Branch changed after publishing; refusing to continue.' >&2; exit 1; }
              [[ "$observed" == "$new_head" ]] && return 0
              if (( attempt < 20 )); then sleep 2; fi
            done
            echo 'Timed out waiting for the PR head to reflect the published commit.' >&2
            exit 1
          }
          check_pr "$HEAD_SHA"
          git fetch --no-tags origin "$HEAD_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || { echo 'PR needs rebasing onto master.' >&2; exit 1; }
          git checkout --detach "$HEAD_SHA"
          for file in desktop/bun.lock desktop/yarn.lock flathub/cargo-sources.json flathub/bun-sources.json; do
            [[ -f "$GENERATED/$file" && ! -L "$GENERATED/$file" ]] || { echo "Missing or unsafe artifact: $file" >&2; exit 1; }
            [[ "$(git ls-tree "$HEAD_SHA" -- "$file" | cut -d ' ' -f 1)" == 100644 ]] || { echo "Unsafe destination: $file" >&2; exit 1; }
            cp -- "$GENERATED/$file" "$file"
          done
          git add -- desktop/bun.lock desktop/yarn.lock flathub/cargo-sources.json flathub/bun-sources.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh locked Flatpak dependency sources'
            check_pr "$HEAD_SHA"
            # Normal fast-forward push; the checked original head is the commit parent.
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git push origin "HEAD:refs/heads/$BRANCH"
            old_head="$HEAD_SHA"
            HEAD_SHA="$(git rev-parse HEAD)"
            wait_for_pr_head "$old_head" "$HEAD_SHA"
          fi
          check_pr "$HEAD_SHA"
          # workflow_dispatch is an explicit exception to GITHUB_TOKEN event suppression.
          for workflow in lint.yml test.yml codeql.yml dependency-audit.yml build-all.yml; do
            check_pr "$HEAD_SHA"
            gh workflow run "$workflow" --repo "$REPO" --ref "$BRANCH" -f "expected_sha=$HEAD_SHA"
          done
          if [[ "$TRANSLATIONS" == true ]]; then
            check_pr "$HEAD_SHA"
            gh workflow run i18n.yml --repo "$REPO" --ref "$BRANCH" -f "expected_sha=$HEAD_SHA"
          fi
          check_pr "$HEAD_SHA"
          gh workflow run dependency-review.yml --repo "$REPO" --ref "$BRANCH" -f "base_ref=$BASE_SHA" -f "head_ref=$HEAD_SHA"
          check_pr "$HEAD_SHA"
