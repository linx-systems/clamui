name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    uses: ./.github/workflows/build-deb.yml
    with:
      sign: true
    secrets: inherit

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Debian package artifacts
        uses: actions/download-artifact@v8
        with:
          name: debian-packages
          path: debs

      - name: Read release notes
        id: notes
        run: |
          {
            echo "notes<<EOF"
            tail -n +2 RELEASE_NOTES.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body: ${{ steps.notes.outputs.notes }}
          files: |
            debs/clamui_*_amd64.deb
            debs/clamui-privileged-helper_*_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
